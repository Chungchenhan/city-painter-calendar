name: CityPainterCalendar
options:
  bundleIdPrefix: com.citypainter
  developmentLanguage: zh-Hant
  knownRegions:
    - zh-Hant
    - Base
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  CityPainterCalendarApp:
    type: application
    platform: iOS
    sources:
      - CityPainterCalendarApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypainter.calendar
        INFOPLIST_FILE: CityPainterCalendarApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CityPainterCalendarWidget
  CityPainterCalendarWidget:
    type: app-extension
    platform: iOS
    sources:
      - CityPainterCalendarWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.citypainter.calendar.widget
        INFOPLIST_FILE: CityPainterCalendarWidget/Info.plist
