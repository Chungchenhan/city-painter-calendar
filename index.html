<!doctype html>
<html lang="zh-Hant" class="cp-startup-locked">
  <head>
    <meta charset="UTF-8" />
    <meta id="cp-startup-viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" data-unlocked-content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6b100" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/src/assets/city-painter-loader-wordmark.svg" type="image/svg+xml" />
    <title>都市彩繪行事曆</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { min-height: 100%; margin: 0; }
      html.cp-startup-locked, html.cp-startup-locked body { width: 100%; height: 100%; overflow: hidden !important; overscroll-behavior: none; }
      html.cp-startup-locked body { position: fixed; inset: 0; }
      html.cp-startup-locked::-webkit-scrollbar, html.cp-startup-locked body::-webkit-scrollbar { display: none; width: 0; height: 0; }
      .cp-initial-loader { position: fixed; inset: 0; z-index: 10000; height: 100%; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px 20px; overflow: hidden; color: #5f6670; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 1; transition: opacity .18s ease; transform: translateZ(0); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .cp-initial-loader--complete { opacity: 0; pointer-events: none; }
      .cp-initial-loader__mark { position: relative; flex: 0 0 auto; width: min(420px, 86vw); aspect-ratio: 2 / 1; contain: layout paint; }
      .cp-initial-loader__icons { position: absolute; top: 11.4%; left: 16.4%; width: 64%; height: 40.5%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3.5%; }
      .cp-initial-loader__icon { display: block; width: 100%; height: 100%; overflow: visible; opacity: 0; will-change: transform, opacity; backface-visibility: hidden; }
      .cp-initial-loader__wordmark { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; opacity: 0; will-change: transform, opacity; backface-visibility: hidden; }
      .cp-initial-loader__registered { position: absolute; top: 11.5%; left: 81%; color: #111; font-family: Arial, sans-serif; font-size: clamp(9px, 3vw, 14px); font-weight: 600; line-height: 1; opacity: 0; }
      .cp-initial-loader--playing .cp-initial-loader__icon--star { animation: cp-star-in .82s cubic-bezier(.2,.8,.25,1) both; }
      .cp-initial-loader--playing .cp-star-glyph { transform-box: fill-box; transform-origin: center; animation: cp-star-spin .82s cubic-bezier(.2,.8,.25,1) both; }
      .cp-initial-loader--playing .cp-star-spark { transform-box: fill-box; transform-origin: center; animation: cp-star-spark .48s ease-out .44s both; }
      .cp-initial-loader--playing .cp-initial-loader__icon--smile { animation: cp-smile-bounce .82s cubic-bezier(.2,.8,.25,1) .68s both; }
      .cp-initial-loader--playing .cp-smile-eye { transform-box: fill-box; transform-origin: center; animation: cp-smile-blink .42s ease-in-out 1.16s both; }
      .cp-initial-loader--playing .cp-initial-loader__icon--sun { animation: cp-sun-in .82s cubic-bezier(.2,.8,.25,1) 1.38s both; }
      .cp-initial-loader--playing .cp-sun-rays { transform-box: fill-box; transform-origin: center; animation: cp-sun-spin .96s cubic-bezier(.2,.8,.25,1) 1.34s both; }
      .cp-initial-loader--playing .cp-sun-glow { transform-box: fill-box; transform-origin: center; animation: cp-sun-glow .84s ease-out 1.62s both; }
      .cp-initial-loader--playing .cp-initial-loader__registered { animation: cp-register-in .28s ease-out 2.04s both; }
      .cp-initial-loader--playing .cp-initial-loader__wordmark { animation: cp-wordmark-in .62s cubic-bezier(.2,.8,.25,1) 2.22s both; }
      .cp-initial-loader__label { flex: 0 0 auto; min-height: 20px; font-size: 14px; font-weight: 650; letter-spacing: .12em; opacity: .62; }
      .cp-initial-loader--waiting .cp-initial-loader__label { animation: cp-initial-label 1.1s ease-in-out infinite alternate; }
      @keyframes cp-star-in { 0% { opacity: 0; transform: scale(.76); } 55% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes cp-star-spin { 0% { transform: rotate(-145deg) scale(.78); } 70% { transform: rotate(10deg) scale(1.07); } 100% { transform: rotate(0) scale(1); } }
      @keyframes cp-star-spark { 0% { opacity: 0; transform: scale(.2) rotate(0); } 48% { opacity: 1; transform: scale(1) rotate(45deg); } 100% { opacity: 0; transform: scale(1.35) rotate(70deg); } }
      @keyframes cp-smile-bounce { 0% { opacity: 0; transform: translateY(10px) scale(.82); } 52% { opacity: 1; transform: translateY(-5px) scale(1.04); } 76% { opacity: 1; transform: translateY(2px) scale(.99); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes cp-smile-blink { 0%, 28%, 72%, 100% { transform: scaleY(1); } 46%, 56% { transform: scaleY(.08); } }
      @keyframes cp-sun-in { 0% { opacity: 0; transform: scale(.8); } 60% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes cp-sun-spin { 0% { transform: rotate(-170deg) scale(.78); } 72% { transform: rotate(9deg) scale(1.04); } 100% { transform: rotate(0) scale(1); } }
      @keyframes cp-sun-glow { 0% { opacity: 0; transform: scale(.72); } 52% { opacity: .52; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.2); } }
      @keyframes cp-register-in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cp-wordmark-in { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes cp-initial-label { from { opacity: .45; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .cp-initial-loader__icon, .cp-initial-loader__wordmark, .cp-initial-loader__registered { opacity: 1; animation: none !important; transform: none !important; } .cp-initial-loader__label { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="calendar-startup-loader" class="cp-initial-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="cp-initial-loader__mark" aria-hidden="true">
        <div class="cp-initial-loader__icons">
          <svg class="cp-initial-loader__icon cp-initial-loader__icon--star" viewBox="0 0 100 100"><rect x="1" y="1" width="98" height="98" rx="27" fill="#b6df00" /><path class="cp-star-glyph" d="M50 17 60 38l23 3-17 16 4 23-20-11-20 11 4-23-17-16 23-3Z" fill="#fff" /><path class="cp-star-spark" d="M85 7v12M79 13h12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0" /></svg>
          <svg class="cp-initial-loader__icon cp-initial-loader__icon--smile" viewBox="0 0 100 100"><rect x="1" y="1" width="98" height="98" rx="27" fill="#eb5ca4" /><g class="cp-smile-eye" fill="#fff"><rect x="27" y="25" width="11" height="24" rx="5.5" /><rect x="62" y="25" width="11" height="24" rx="5.5" /></g><path d="M29 59c4 20 38 20 42 0" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" /></svg>
          <svg class="cp-initial-loader__icon cp-initial-loader__icon--sun" viewBox="0 0 100 100"><rect x="1" y="1" width="98" height="98" rx="27" fill="#fdbb13" /><circle class="cp-sun-glow" cx="50" cy="50" r="39" fill="none" stroke="#fff3b4" stroke-width="5" opacity="0" /><g class="cp-sun-rays" fill="#fff"><polygon points="50,9.5 47.6,13.1 48.8,23.8 46.4,27.4 56,27.4 57.1,28.6 57.1,23.8 51.2,16.7" /><polygon points="79.8,20.2 72.6,22.6 65.5,31 63.1,31 67.9,34.5 70.2,39.3 72.6,38.1 73.8,35.7 73.8,28.6" /><polygon points="72.6,57.1 78.6,56 85.7,50 91.7,50 85.7,46.4 76.2,47.6 72.6,45.2 73.8,47.6" /><polygon points="61.9,70.2 61.9,71.4 65.5,73.8 72.6,73.8 79.8,78.6 77.4,71.4 75,70.2 69,63.1 69,64.3" /><polygon points="44,71.4 44,76.2 51.2,85.7 51.2,91.7 53.6,88.1 53.6,73.8 54.8,72.6 45.2,72.6" /><polygon points="31,60.7 27.4,65.5 27.4,72.6 21.4,79.8 27.4,78.6 34.5,70.2 38.1,69" /><polygon points="28.6,44 27.4,42.9 23.8,44 16.7,50 9.5,50 15.5,53.6 26.2,52.4 28.6,54.8" /><polygon points="21.4,20.2 23.8,27.4 31,33.3 32.1,36.9 40.5,29.8 35.7,26.2 28.6,26.2" /></g><circle cx="50.6" cy="50.6" r="15" fill="#fdbb13" stroke="#fff" stroke-width="4.5" /></svg>
        </div>
        <span class="cp-initial-loader__registered">®</span>
        <img class="cp-initial-loader__wordmark" src="/src/assets/city-painter-loader-wordmark.svg" alt="" fetchpriority="high" decoding="sync" />
      </div>
      <span class="cp-initial-loader__label">行事曆載入中</span>
    </div>
    <script>
      (() => {
        const loader = document.getElementById('calendar-startup-loader')
        const rootElement = document.documentElement
        const viewport = document.getElementById('cp-startup-viewport')
        const preventInteraction = (event) => event.preventDefault()
        const preventPinch = (event) => {
          if (event.touches?.length > 1) event.preventDefault()
        }
        const preventZoomWheel = (event) => {
          if (event.ctrlKey) event.preventDefault()
        }
        const listenerOptions = { passive: false }
        document.addEventListener('gesturestart', preventInteraction, listenerOptions)
        document.addEventListener('gesturechange', preventInteraction, listenerOptions)
        document.addEventListener('gestureend', preventInteraction, listenerOptions)
        document.addEventListener('touchmove', preventPinch, listenerOptions)
        document.addEventListener('wheel', preventZoomWheel, listenerOptions)
        document.addEventListener('selectstart', preventInteraction, listenerOptions)
        document.addEventListener('dragstart', preventInteraction, listenerOptions)

        const releaseStartupLock = () => {
          rootElement.classList.remove('cp-startup-locked')
          if (viewport?.dataset.unlockedContent) viewport.content = viewport.dataset.unlockedContent
          document.removeEventListener('gesturestart', preventInteraction)
          document.removeEventListener('gesturechange', preventInteraction)
          document.removeEventListener('gestureend', preventInteraction)
          document.removeEventListener('touchmove', preventPinch)
          document.removeEventListener('wheel', preventZoomWheel)
          document.removeEventListener('selectstart', preventInteraction)
          document.removeEventListener('dragstart', preventInteraction)
        }

        if (!loader) {
          releaseStartupLock()
          return
        }
        const removalObserver = new MutationObserver(() => {
          if (document.getElementById('calendar-startup-loader')) return
          removalObserver.disconnect()
          releaseStartupLock()
        })
        removalObserver.observe(document.body, { childList: true })
        requestAnimationFrame(() => {
          const startedAt = String(performance.now())
          loader.dataset.startedAt = startedAt
          loader.dataset.animationStartedAt = startedAt
          loader.classList.add('cp-initial-loader--playing')
        })
      })()
    </script>
    <div id="root" aria-hidden="true" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
